<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">
    
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="recompensas">
      <ion-icon name="gift-outline"></ion-icon>
      <ion-label>Premios</ion-label>
    </ion-tab-button>

<!-- BOTÓN CENTRAL (ESCÁNER) -->
    <ion-tab-button tab="escanear" class="scan-tab-btn">
      <div class="scan-circle">
        <ion-icon name="scan-outline"></ion-icon>
      </div>
    </ion-tab-button>

    <ion-tab-button tab="historial">
      <ion-icon name="time-outline"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <!-- QUINTA OPCIÓN: "OPCIONES" (que carga tu componente perfil) -->
    <ion-tab-button tab="perfil">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Opciones</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
